    <meta name="theme-color" content="#ddd6cb" />
    <!--
      Runs before the bundle and before the first paint. A night reader used to get a
      warm flash on every load, because `useTheme` writes `data-theme` in a React
      effect — after the ground has already been painted. The default is the operating
      system's preference rather than 'warm', so a dark-OS visitor is not handed the
      light ground on their first visit. Keep the storage key in step with
      `src/hooks/useTheme.ts`.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('camtaylor-theme');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var night = stored ? stored === 'night' : !!dark;
          document.documentElement.dataset.theme = night ? 'night' : 'warm';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', night ? '#12100e' : '#ddd6cb');
        } catch (error) {
          /* private mode or no matchMedia: the stylesheet default stands */
        }
      })();
    </script>
