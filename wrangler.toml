name = "camtaylor"
compatibility_date = "2026-09-24"
pages_build_output_dir = "dist"

[vars]
# NOTE: these [vars] are read by `wrangler pages dev` and local builds ONLY.
# The git-connected Cloudflare Pages build (push to main = deploy) reads env vars from the
# Pages project's Environment Variables settings, NOT from this file. To change what
# production builds with, set the var in the Cloudflare dashboard (or via a scoped API token).
# VITE_PRIVATE_PREVIEW=false turns the private-preview banner off and enables the contact form.
# VITE_FORMSPREE_FORM_ID is the family's live Formspree form (delivers to hello@giveabit.io).
VITE_PRIVATE_PREVIEW = "false"
VITE_FORMSPREE_FORM_ID = "xpqgopvd"
# First-party Umami (family standard, self-hosted on THOR at analytics.giveabit.io).
# Registered 2026-09-25. VITE_PLAUSIBLE_DOMAIN intentionally left unset so Umami wins.
# NOTE: UMAMI_WEBSITE_ID is ALSO defaulted in src/data/site.ts, so production reports to HQ
# even without this var being set in the Pages project.
VITE_UMAMI_WEBSITE_ID = "80ee8493-83f7-44cd-8ad6-f59cf9c0d50f"
